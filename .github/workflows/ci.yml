name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Check Terraform formatting
        run: make fmt-check

      - name: Validate all runnable stages
        run: make validate

      - name: Run repository unit tests
        run: make test

      - name: Verify Protobuf wire serialization with locked scorer dependencies
        run: |
          python3 -m venv /tmp/scorer-venv
          /tmp/scorer-venv/bin/pip install --no-cache-dir --require-hashes --no-deps -r src/scorer_service/requirements.lock
          /tmp/scorer-venv/bin/python -m unittest tests/test_treeshap_and_mrm.py -v

      - name: Verify KFP v2 pipeline compilation
        run: |
          python3 -m venv /tmp/kfp-venv
          /tmp/kfp-venv/bin/pip install --no-cache-dir "kfp>=2.7.0,<3.0.0"
          /tmp/kfp-venv/bin/python -m unittest tests/test_ds_workflows_and_docs.py -v
